<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard SIMRS - Demo Mode</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 min-h-screen text-slate-800 antialiased">
    <!-- Navbar Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <div
            class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md shadow-blue-500/20"
          >
            <i class="fa-solid fa-hospital text-xl"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg text-slate-900 leading-tight">
              Portal SIMRS
            </h1>
            <p class="text-xs text-slate-500 font-medium">
              Sistem Informasi Manajemen Rumah Sakit
            </p>
          </div>
        </div>
        <div
          class="flex items-center gap-2 bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full text-xs font-semibold border border-blue-200"
        >
          <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
          Demo / Frontend Mode
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Quick Stats Widget -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
        <div
          class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center text-xl font-semibold"
          >
            <i class="fa-solid fa-users"></i>
          </div>
          <div>
            <p class="text-xs font-medium text-slate-500">
              Total Pasien Terdaftar
            </p>
            <h3 id="statTotalPasien" class="text-2xl font-bold text-slate-900">
              0
            </h3>
          </div>
        </div>
        <div
          class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl font-semibold"
          >
            <i class="fa-solid fa-database"></i>
          </div>
          <div>
            <p class="text-xs font-medium text-slate-500">Penyimpanan</p>
            <h3 class="text-base font-bold text-emerald-600">
              Local Storage Active
            </h3>
          </div>
        </div>
        <div
          class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-4"
        >
          <div
            class="w-12 h-12 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-xl font-semibold"
          >
            <i class="fa-solid fa-bolt"></i>
          </div>
          <div>
            <p class="text-xs font-medium text-slate-500">Performa UI</p>
            <h3 class="text-base font-bold text-slate-800">Instant Response</h3>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Form Pendaftaran -->
        <div class="lg:col-span-4">
          <div
            class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 sticky top-24"
          >
            <div
              class="flex items-center gap-2 mb-5 pb-4 border-b border-slate-100"
            >
              <i class="fa-solid fa-address-card text-blue-600"></i>
              <h2 class="font-bold text-slate-900 text-base">
                Pendaftaran Pasien Baru
              </h2>
            </div>

            <form id="formPasien" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5"
                  >Nomor Rekam Medis (RM)</label
                >
                <input
                  type="text"
                  id="nomor_rm"
                  placeholder="Contoh: RM-001"
                  required
                  class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition-all"
                />
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5"
                  >Nama Lengkap Pasien</label
                >
                <input
                  type="text"
                  id="nama"
                  placeholder="Masukkan nama pasien"
                  required
                  class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition-all"
                />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label
                    class="block text-xs font-semibold text-slate-700 mb-1.5"
                    >Tanggal Lahir</label
                  >
                  <input
                    type="date"
                    id="tanggal_lahir"
                    required
                    class="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition-all"
                  />
                </div>
                <div>
                  <label
                    class="block text-xs font-semibold text-slate-700 mb-1.5"
                    >Jenis Kelamin</label
                  >
                  <select
                    id="jenis_kelamin"
                    required
                    class="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition-all bg-white"
                  >
                    <option value="Laki-laki">Laki-laki</option>
                    <option value="Perempuan">Perempuan</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5"
                  >Alamat Lengkap</label
                >
                <textarea
                  id="alamat"
                  rows="3"
                  placeholder="Masukkan alamat lengkap..."
                  required
                  class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-500/10 transition-all resize-none"
                ></textarea>
              </div>

              <button
                type="submit"
                class="w-full mt-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm py-3 px-4 rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2"
              >
                <i class="fa-solid fa-plus"></i>
                Daftarkan Pasien
              </button>
            </form>
          </div>
        </div>

        <!-- Tabel Daftar Pasien -->
        <div class="lg:col-span-8">
          <div
            class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden"
          >
            <div
              class="p-6 border-b border-slate-100 flex items-center justify-between"
            >
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-hospital-user text-blue-600"></i>
                <h2 class="font-bold text-slate-900 text-base">
                  Daftar Pasien Terdaftar
                </h2>
              </div>
              <span class="text-xs text-slate-400 font-medium"
                >Interactive Demo</span
              >
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr
                    class="bg-slate-50/80 text-slate-500 font-semibold text-xs border-b border-slate-100"
                  >
                    <th class="py-3.5 px-4">No RM</th>
                    <th class="py-3.5 px-4">Nama Pasien</th>
                    <th class="py-3.5 px-4">Tgl Lahir</th>
                    <th class="py-3.5 px-4">Gender</th>
                    <th class="py-3.5 px-4">Alamat</th>
                    <th class="py-3.5 px-4 text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tabelPasien" class="divide-y divide-slate-100">
                  <!-- Data dimuat via JS LocalStorage -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      // Data awal dummy jika belum ada data di LocalStorage
      const dataAwal = [
        {
          id: 1,
          nomor_rm: "RM-001",
          nama: "Budi Santoso",
          tanggal_lahir: "1998-05-12",
          jenis_kelamin: "Laki-laki",
          alamat: "Jl. Sudirman No. 12",
        },
        {
          id: 2,
          nomor_rm: "RM-002",
          nama: "Siti Rahma",
          tanggal_lahir: "2000-08-20",
          jenis_kelamin: "Perempuan",
          alamat: "Jl. Gatot Subroto No. 45",
        },
      ];

      function getPasien() {
        const data = localStorage.getItem("simrs_pasien");
        if (!data) {
          localStorage.setItem("simrs_pasien", JSON.stringify(dataAwal));
          return dataAwal;
        }
        return JSON.parse(data);
      }

      function muatPasien() {
        const data = getPasien();
        const tbody = document.getElementById("tabelPasien");
        document.getElementById("statTotalPasien").innerText = data.length;
        tbody.innerHTML = "";

        if (data.length === 0) {
          tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-8 text-center text-slate-400 text-xs font-medium">
                            Belum ada data pasien terdaftar.
                        </td>
                    </tr>
                `;
          return;
        }

        data.forEach((p) => {
          const badgeJk =
            p.jenis_kelamin === "Laki-laki"
              ? `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-100">Laki-laki</span>`
              : `<span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-pink-50 text-pink-600 border border-pink-100">Perempuan</span>`;

          tbody.innerHTML += `
                    <tr class="hover:bg-slate-50/60 transition-colors">
                        <td class="py-3.5 px-4 font-bold text-slate-900 font-mono text-xs">${p.nomor_rm}</td>
                        <td class="py-3.5 px-4 font-semibold text-slate-800">${p.nama}</td>
                        <td class="py-3.5 px-4 text-xs text-slate-500">${p.tanggal_lahir}</td>
                        <td class="py-3.5 px-4">${badgeJk}</td>
                        <td class="py-3.5 px-4 text-xs text-slate-500 max-w-[150px] truncate">${p.alamat}</td>
                        <td class="py-3.5 px-4 text-center">
                            <button onclick="hapusPasien(${p.id}, '${p.nama}')" 
                                class="p-2 text-rose-600 hover:bg-rose-50 rounded-lg transition-colors" title="Hapus Data">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    </tr>
                `;
        });
      }

      document.getElementById("formPasien").addEventListener("submit", (e) => {
        e.preventDefault();

        const listPasien = getPasien();
        const nomorRm = document.getElementById("nomor_rm").value;

        // Cek jika nomor RM duplikat
        if (listPasien.some((p) => p.nomor_rm === nomorRm)) {
          alert("Nomor RM sudah terdaftar!");
          return;
        }

        const pasienBaru = {
          id: Date.now(),
          nomor_rm: nomorRm,
          nama: document.getElementById("nama").value,
          tanggal_lahir: document.getElementById("tanggal_lahir").value,
          jenis_kelamin: document.getElementById("jenis_kelamin").value,
          alamat: document.getElementById("alamat").value,
        };

        listPasien.push(pasienBaru);
        localStorage.setItem("simrs_pasien", JSON.stringify(listPasien));

        document.getElementById("formPasien").reset();
        muatPasien();
      });

      function hapusPasien(id, nama) {
        if (confirm(`Apakah Anda yakin ingin menghapus data pasien ${nama}?`)) {
          let listPasien = getPasien();
          listPasien = listPasien.filter((p) => p.id !== id);
          localStorage.setItem("simrs_pasien", JSON.stringify(listPasien));
          muatPasien();
        }
      }

      muatPasien();
    </script>
  </body>
</html>
